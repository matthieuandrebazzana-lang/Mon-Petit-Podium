<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover est indispensable : sans lui, env(safe-area-inset-*)
         vaut toujours 0 et le contenu ne se décale pas sous la Dynamic Island. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Greed F1</title>
    <meta name="description" content="Pronostics Formule 1 entre amis." />
    <meta name="theme-color" content="#800111" />

    <!-- Installation sur l'écran d'accueil iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Greed F1" />
    <!-- "default" garde un texte de statut sombre, lisible sur le fond beige.
         "black-translucent" imposerait un texte blanc illisible ici. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- iOS applique son propre masque arrondi à cette icône : elle est donc
         rendue à fond perdu et sans transparence (une apple-touch-icon
         transparente est rendue noire). Régénérée par `npm run icones`. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />

    <!-- Empêche iOS de transformer les nombres en liens d'appel
         (les scores et numéros de voiture en sont truffés). -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
