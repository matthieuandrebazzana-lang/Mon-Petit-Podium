<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover est indispensable : sans lui, env(safe-area-inset-*)
         vaut toujours 0 et le contenu ne se décale pas sous la Dynamic Island. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Mon Petit Podium</title>
    <meta name="description" content="Pronostics Formule 1 entre amis." />
    <meta name="theme-color" content="#800111" />

    <!-- Installation sur l'écran d'accueil iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Podium" />
    <!-- "default" garde un texte de statut sombre, lisible sur le fond beige.
         "black-translucent" imposerait un texte blanc illisible ici. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Empêche iOS de transformer les nombres en liens d'appel
         (les scores et numéros de voiture en sont truffés). -->
    <meta name="format-detection" content="telephone=no" />

    <!-- TEST Liquid Glass (version 0.23.0) — dashersw/liquid-glass-js.
         Tout ce bloc est jetable : le retirer, avec les trois fichiers de
         `public/` et le `useEffect` de `NavBarre.jsx`, rend l'app à son état
         antérieur. Voir CLAUDE.md, section « Liquid Glass ». -->
    <link rel="stylesheet" href="/glass.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- L'ordre est contraint : html2canvas d'abord (la librairie l'appelle
         pour photographier la page), puis container.js, puis button.js —
         `class Button extends Container` exige que Container soit déjà évalué.
         `defer` sur les trois : ils s'exécutent alors dans l'ordre du document
         et **avant** le script de module ci-dessous (lui aussi différé par
         nature), sans bloquer l'analyse du HTML. -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
    ></script>
    <script defer src="/container.js"></script>
    <script defer src="/button.js"></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
