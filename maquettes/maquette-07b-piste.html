  .champ-meta { font-size: 13px; color: #999; margin-top: 3px; }

  .toggle-btn { flex: 1; padding: 10px; text-align: center; font-size: 13px; font-weight: 500; border-radius: 12px; color: #999; }
  .toggle-btn.active { background: #800111; color: #fff; }

  /* Zone piste pleine largeur */
  .piste-full { position: relative; width: 100%; flex: 1; overflow: hidden; min-height: 550px; }

  /* Route SVG en fond */
  .route-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

  /* Voitures + légende superposées */
  .piste-content { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; }
  .piste-track { flex: 1; position: relative; }
  .legende { width: 64px; flex-shrink: 0; position: relative; padding-top: 4px; }
  .legende-item { position: absolute; right: 8px; display: flex; flex-direction: column; align-items: flex-end; }
  .legende-pts { font-size: 12px; font-weight: 700; color: #fff; line-height: 1; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  .legende-name { font-size: 9px; color: rgba(255,255,255,0.7); margin-top: 1px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

  /* Ligne arrivée */
  .ligne-arrivee { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: repeating-linear-gradient(90deg, #fff 0px, #fff 8px, #1a1a1a 8px, #1a1a1a 16px); z-index: 5; }
  .arrivee-label { position: absolute; top: 8px; left: 12px; font-size: 9px; color: rgba(255,255,255,0.8); letter-spacing: 0.5px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.8); z-index: 5; }

  .voiture { position: absolute; left: 50%; transform: translateX(-50%); z-index: 6; }
  .voiture svg { width: 52px; height: auto; }

  .navbar { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; border-radius: 0 0 44px 44px; padding: 14px 32px 28px; display: flex; justify-content: space-around; align-items: center; z-index: 20; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .nav-lbl { font-size: 10px; color: #bbb; }
  .nav-lbl.active { color: #800111; }
