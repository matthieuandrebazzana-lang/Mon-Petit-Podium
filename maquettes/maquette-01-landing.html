<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maquette 1 — Landing · Mon Petit Podium</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #2a2a2a; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 40px 20px; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .phone { background: #F5F0EB; width: 375px; min-height: 812px; border-radius: 54px; overflow: hidden; border: 10px solid #1a1a1a; box-shadow: 0 30px 80px rgba(0,0,0,0.5); position: relative; }
  .sb { background: #F5F0EB; padding: 16px 24px 0; display: flex; justify-content: space-between; align-items: center; }
  .sb-time { font-size: 13px; font-weight: 600; color: #1a1a1a; }
  .sb-icons { display: flex; gap: 6px; align-items: center; }
  .widgets { padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 12px; }

  .w-hero { background: #800111; border-radius: 28px; padding: 36px 24px 32px; text-align: center; }
  .logo-circle { width: 68px; height: 68px; background: rgba(255,255,255,0.15); border-radius: 20px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; }
  .logo-text { color: rgba(255,255,255,0.7); font-size: 11px; letter-spacing: 2.5px; font-weight: 500; margin-bottom: 12px; }
  .hero-title { color: #fff; font-size: 32px; font-weight: 500; line-height: 1.2; margin-bottom: 12px; }
  .hero-sub { color: rgba(255,255,255,0.65); font-size: 15px; line-height: 1.6; }

  .w-features { background: #fff; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .feat-row { display: flex; align-items: center; gap: 14px; }
  .feat-icon { width: 44px; height: 44px; border-radius: 13px; background: #F5F0EB; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .feat-title { font-size: 15px; font-weight: 500; color: #1a1a1a; }
  .feat-sub { font-size: 12px; color: #999; margin-top: 2px; }

  .w-btns { display: flex; flex-direction: column; gap: 10px; }
  .btn-main { background: #800111; border-radius: 18px; padding: 19px; text-align: center; color: #fff; font-size: 17px; font-weight: 500; }
  .btn-sec { background: #fff; border-radius: 18px; padding: 19px; text-align: center; color: #800111; font-size: 17px; font-weight: 500; }

  .w-footer { text-align: center; padding: 4px 0; }
  .footer-txt { font-size: 11px; color: #bbb; }
</style>
</head>
<body>
<div class="phone">
  <div class="sb">
    <span class="sb-time">9:41</span>
    <div class="sb-icons">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="#1a1a1a"/></svg>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2"><rect x="2" y="7" width="20" height="11" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
    </div>
  </div>

  <div class="widgets">
    <div class="w-hero">
      <div class="logo-circle">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
      </div>
      <div class="logo-text">MON PETIT PODIUM</div>
      <div class="hero-title">Pronostique chaque Grand Prix</div>
      <div class="hero-sub">Crée ta ligue, invite tes amis, et grimpe au classement à chaque course.</div>
    </div>

    <div class="w-features">
      <div class="feat-row">
        <div class="feat-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#800111" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <div>
          <div class="feat-title">Ligues privées</div>
          <div class="feat-sub">Rejoins avec un code à 6 caractères</div>
        </div>
      </div>
      <div class="feat-row">
        <div class="feat-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#800111" stroke-width="2"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        </div>
        <div>
          <div class="feat-title">Ta voiture, ton style</div>
          <div class="feat-sub">Personnalise couleurs et numéro</div>
        </div>
      </div>
    </div>

    <div class="w-btns">
      <div class="btn-main">Créer un compte</div>
      <div class="btn-sec">J'ai déjà un compte</div>
    </div>

    <div class="w-footer">
      <div class="footer-txt">Mon Petit Podium · v1.0</div>
    </div>
  </div>
</div>
</body>
</html>
