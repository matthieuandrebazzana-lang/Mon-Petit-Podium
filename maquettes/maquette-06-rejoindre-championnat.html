<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maquette 6 — Rejoindre un championnat · Mon Petit Podium</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #2a2a2a; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 40px 20px; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .phone { background: #F5F0EB; width: 375px; min-height: 812px; border-radius: 54px; overflow: hidden; border: 10px solid #1a1a1a; box-shadow: 0 30px 80px rgba(0,0,0,0.5); position: relative; }
  .sb { background: #F5F0EB; padding: 16px 24px 0; display: flex; justify-content: space-between; align-items: center; }
  .sb-time { font-size: 13px; font-weight: 600; color: #1a1a1a; }
  .sb-icons { display: flex; gap: 6px; align-items: center; }
  .widgets { padding: 16px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 40px; }

  .back { display: flex; align-items: center; gap: 5px; color: #800111; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .page-title { font-size: 30px; font-weight: 500; color: #1a1a1a; line-height: 1.2; }
  .page-sub { font-size: 13px; color: #999; margin-top: 4px; }

  .w-code { background: #fff; border-radius: 24px; padding: 20px; }
  .field-lbl { font-size: 11px; font-weight: 500; color: #999; letter-spacing: 0.6px; margin-bottom: 14px; }
  .code-boxes { display: flex; gap: 8px; justify-content: center; }
  .code-box { width: 48px; height: 58px; background: #F5F0EB; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 500; color: #1a1a1a; }
  .code-box.active { background: #800111; color: #fff; }
  .code-box.empty { color: #ddd; }

  .w-preview { background: #800111; border-radius: 24px; padding: 20px; display: flex; align-items: center; gap: 14px; }
  .preview-photo { width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .preview-name { font-size: 18px; font-weight: 500; color: #fff; }
  .preview-meta { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 3px; }

  .w-btn { background: #800111; border-radius: 18px; padding: 19px; text-align: center; color: #fff; font-size: 17px; font-weight: 500; }
  .w-btn.disabled { background: #ddd; color: #bbb; }
</style>
</head>
<body>
<div class="phone">
  <div class="sb">
    <span class="sb-time">9:41</span>
    <div class="sb-icons">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="#1a1a1a"/></svg>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2"><rect x="2" y="7" width="20" height="11" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
    </div>
  </div>

  <div class="widgets">
    <div>
      <div class="back">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#800111" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Retour
      </div>
      <div class="page-title">Rejoindre un championnat</div>
      <div class="page-sub">Entre le code à 6 caractères reçu.</div>
    </div>

    <div class="w-code">
      <div class="field-lbl">CODE D'INVITATION</div>
      <div class="code-boxes">
        <div class="code-box active">F</div>
        <div class="code-box active">1</div>
        <div class="code-box active">X</div>
        <div class="code-box active">7</div>
        <div class="code-box empty">—</div>
        <div class="code-box empty">—</div>
      </div>
    </div>

    <div class="w-preview">
      <div class="preview-photo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div>
        <div class="preview-name">Les Potes F1</div>
        <div class="preview-meta">6 membres · Créé par Matthieu</div>
      </div>
    </div>

    <div class="w-btn">Rejoindre le championnat</div>
  </div>
</div>
</body>
</html>
